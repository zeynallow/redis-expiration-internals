# Base configuration for all experiments. Per-experiment overrides are passed
# on the command line and recorded (together with CONFIG GET *) in every raw
# result file.
bind 127.0.0.1
protected-mode yes
daemonize no
loglevel notice

# --- persistence disabled (not under study unless an experiment says so) ---
save ""
appendonly no

# --- debug command needed for the research-only trace builds ---
enable-debug-command local

# --- expiration-related settings, pinned to their defaults explicitly ---
hz 10
dynamic-hz yes
active-expire-effort 1
lazyfree-lazy-expire no
lazyfree-lazy-user-del no
activerehashing yes
activedefrag no
jemalloc-bg-thread yes
maxmemory 0
io-threads 1

# --- observability ---
latency-monitor-threshold 1
slowlog-log-slower-than 10000
